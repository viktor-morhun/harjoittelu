<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Outreach tracker for finding a work-practice placement in Helsinki-region IT companies.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230A0A0A'/%3E%3Cpath d='M9 22V10h8a4 4 0 010 8H9' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
<title>Harjoittelu Pipeline</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: top bar, stat strip, stage tabs, toolbar, table; details open in a right-side drawer */
:root{
  --bg:#FFFFFF; --subtle:#FAFAFA; --fg:#0A0A0A; --fg2:#404040; --muted:#737373; --line:#E5E5E5; --line2:#F0F0F0; --sel:#F5F5F5;
  --amber:#B45309; --red:#B91C1C;
  --b-new:#F4F4F5; --t-new:#52525B; --b-sent:#EFF6FF; --t-sent:#1D4ED8; --b-replied:#F5F3FF; --t-replied:#6D28D9;
  --b-interview:#FFFBEB; --t-interview:#B45309; --b-accepted:#F0FDF4; --t-accepted:#15803D; --b-declined:#FEF2F2; --t-declined:#B91C1C;
  --shadow:0 8px 30px rgba(0,0,0,.08);
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
:root[data-mode="dark"]{
  --bg:#0A0A0A; --subtle:#111111; --fg:#EDEDED; --fg2:#C7C7C7; --muted:#8F8F8F; --line:#262626; --line2:#1C1C1C; --sel:#171717;
  --amber:#F59E0B; --red:#F87171;
  --b-new:#1F1F23; --t-new:#A1A1AA; --b-sent:#172554; --t-sent:#93C5FD; --b-replied:#2E1065; --t-replied:#C4B5FD;
  --b-interview:#451A03; --t-interview:#FCD34D; --b-accepted:#052E16; --t-accepted:#86EFAC; --b-declined:#450A0A; --t-declined:#FCA5A5;
  --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans);margin:0;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
svg{width:16px;height:16px;flex:none}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:20px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
h1{font-size:16px;font-weight:600;margin:0;letter-spacing:-.01em}
.sync{font:12px var(--mono);color:var(--muted)}
.actions{display:flex;gap:6px;align-items:center}
.icon{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg2)}
.icon:hover{background:var(--subtle);color:var(--fg)}
.btn{height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--fg);background:var(--fg);color:var(--bg);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{opacity:.88}
.btn2{height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:var(--bg);font-weight:500;display:inline-flex;align-items:center;gap:6px;color:var(--fg)}
.btn2:hover{background:var(--subtle)}
.btn2:disabled,.btn:disabled{opacity:.45;cursor:default}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:8px}
.stat{padding:14px 16px;border-left:1px solid var(--line);background:none;border-top:0;border-right:0;border-bottom:0;text-align:left}
.stat:first-child{border-left:0}
.stat dt{font-size:12px;color:var(--muted)}
.stat dd{margin:2px 0 0;font:500 22px/1.2 var(--mono);letter-spacing:-.02em}
.stat dd small{font-size:13px;color:var(--muted);letter-spacing:0}
button.stat{cursor:pointer}
button.stat:hover{background:var(--subtle)}
button.stat[aria-pressed="true"] dd{color:var(--amber)}

/* tabs + toolbar */
.tabs{display:flex;gap:20px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin-top:24px}
.tab{background:none;border:0;padding:8px 0 10px;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:6px;align-items:baseline}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.tab .n{font:12px var(--mono);color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;padding-block:14px}
.field{height:32px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:0 10px}
.search{flex:1 1 240px;min-width:0;display:flex;align-items:center;gap:8px;color:var(--muted)}
.search input{border:0;background:none;outline:0;flex:1;min-width:0;color:var(--fg);height:100%}
.search input::placeholder{color:var(--muted)}
.search:focus-within{border-color:var(--fg)}
kbd{font:11px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.toggle{color:var(--muted)}
.toggle[aria-pressed="true"]{color:var(--fg);border-color:var(--fg)}

/* table */
.table{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:64px}
.tr{display:grid;grid-template-columns:minmax(0,1fr) 56px 130px 92px 92px;gap:16px;align-items:center;padding:0 16px;min-height:52px;border-top:1px solid var(--line2)}
.th{min-height:36px;font-size:12px;color:var(--muted);background:var(--subtle);border-top:0;border-bottom:1px solid var(--line)}
.th .r,.tr .r{text-align:right}
.row{cursor:pointer}
.row:hover{background:var(--subtle)}
.row.active{background:var(--sel)}
.th + .row{border-top:0}
.co{min-width:0;padding-block:8px}
.co b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.co .sub{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hire{color:var(--fg2)}
.fit{font:13px var(--mono);text-align:right;color:var(--fg2)}
.dt{font:12px var(--mono);color:var(--muted);text-align:right}
.due{color:var(--amber)}
.pill{border:0;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:500;max-width:100%;justify-self:start;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.pill:disabled{cursor:default}
.s-new{background:var(--b-new);color:var(--t-new)} .s-sent{background:var(--b-sent);color:var(--t-sent)}
.s-replied{background:var(--b-replied);color:var(--t-replied)} .s-interview{background:var(--b-interview);color:var(--t-interview)}
.s-accepted{background:var(--b-accepted);color:var(--t-accepted)} .s-declined{background:var(--b-declined);color:var(--t-declined)}
.empty{padding:56px 16px;text-align:center;color:var(--muted)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.18);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100vw);background:var(--bg);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:31;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 24px 16px;border-bottom:1px solid var(--line)}
.dh h2{font-size:18px;font-weight:600;margin:0;letter-spacing:-.01em}
.dh p{margin:2px 0 0;color:var(--muted);font-size:13px}
.db{overflow-y:auto;padding:20px 24px 32px;display:grid;gap:24px}
.sec{display:grid;gap:8px}
.lbl{font-size:12px;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:500;color:var(--fg2)}
.seg button:hover{border-color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.date{width:100%;font:13px var(--mono)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{text-decoration:none}
.text{color:var(--fg2);margin:0}
.contact{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.contact span{overflow-wrap:anywhere;min-width:0}
.link{background:none;border:0;padding:0;color:var(--muted);font-size:12px;white-space:nowrap}
.link:hover{color:var(--fg)}
.msg{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.msg-h{display:flex;justify-content:space-between;align-items:center;padding:6px 6px 6px 12px;border-bottom:1px solid var(--line);background:var(--subtle)}
.lang{display:flex;gap:2px}
.lang button{border:0;background:none;padding:3px 8px;border-radius:4px;font-size:12px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--bg);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.msg-b{padding:12px;white-space:pre-wrap;font-size:13px;color:var(--fg2);max-height:240px;overflow-y:auto}
.msg-b strong{color:var(--fg);font-weight:500}
.msg-f{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
textarea{width:100%;min-height:96px;resize:vertical;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:8px 10px;line-height:1.5}
textarea:focus,.field:focus{outline:0;border-color:var(--fg)}
.log{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.log li{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--fg2)}
.log time{font:12px var(--mono);color:var(--muted)}
.muted{color:var(--muted);font-size:12px;margin:0}
.danger{color:var(--red)}

/* dropdowns */
.dd{display:inline-flex;align-items:center;gap:8px;color:var(--fg)}
.dd::after,.pill::after{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-2px) rotate(45deg);opacity:.55}
.dd[aria-expanded="true"]{border-color:var(--fg)}
.menu{position:fixed;z-index:50;min-width:168px;background:var(--bg);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:4px;display:grid}
.menu button{border:0;background:none;text-align:left;padding:7px 10px 7px 28px;border-radius:5px;font-size:13px;position:relative;color:var(--fg)}
.menu button:hover,.menu button:focus-visible{background:var(--subtle);outline:0}
.menu button[aria-checked="true"]::before{content:"";position:absolute;left:11px;top:50%;width:4px;height:8px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-65%) rotate(45deg)}

/* dialogs */
dialog{border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);padding:0;width:min(520px,calc(100vw - 32px));box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.25)}
dialog form{display:grid;gap:14px;padding:20px}
dialog h3{font-size:16px;font-weight:600;margin:0}
dialog label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
dialog .field{width:100%;color:var(--fg)}
dialog textarea{min-height:160px;font-size:13px}
.foot{display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;z-index:40}

@media (max-width:760px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat:nth-child(3){border-left:0}
  .stat:nth-child(n+3){border-top:1px solid var(--line)}
  .tr{grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:0 12px}
  .th{display:none}
  .fit,.dt{display:none}
  .two{grid-template-columns:1fr}
  .dh,.db{padding-left:20px;padding-right:20px}
  .hide-sm{display:none}
}
@media (prefers-reduced-motion:no-preference){.drawer{animation:in .18s ease-out}@keyframes in{from{transform:translateX(16px);opacity:0}}}
</style>
</head>
<body>


<div class="wrap">
  <div class="top">
    <div class="brand"><h1>Pipeline</h1><span class="sync" id="sync"></span></div>
    <div class="actions">
      <button class="icon" id="exportBtn" type="button" title="Export CSV" aria-label="Export CSV"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg></button>
      <button class="icon" id="settingsBtn" type="button" title="Profile and templates" aria-label="Profile and templates"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg></button>
      <button class="icon" id="modeBtn" type="button" title="Theme" aria-label="Toggle theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
      <button class="btn" id="addBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span class="hide-sm">Add company</span></button>
    </div>
  </div>

  <dl class="stats" id="stats"></dl>
  <div class="tabs" id="tabs" role="tablist"></div>

  <div class="toolbar">
    <label class="field search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search companies" aria-label="Search"><kbd class="hide-sm">/</kbd></label>
    <button class="field dd" type="button" data-menu="prio" aria-haspopup="menu" aria-expanded="false"></button>
    <button class="field dd" type="button" data-menu="city" aria-haspopup="menu" aria-expanded="false"></button>
    <button class="field toggle" id="hiring" type="button" aria-pressed="false">Hiring now</button>
    <button class="field dd" type="button" data-menu="sort" aria-haspopup="menu" aria-expanded="false"></button>
  </div>

  <div class="table" id="table" role="list"></div>
</div>

<div id="drawerRoot"></div>
<div class="menu" id="menu" role="menu" hidden></div>

<dialog id="addDlg"><form id="addForm">
  <h3>Add company</h3>
  <label>Name<input class="field" id="a-name" required autocomplete="off"></label>
  <div class="two"><label>City<input class="field" id="a-city" value="Helsinki"></label>
  <label>Priority<select class="field" id="a-prio"><option>A</option><option selected>B</option><option>C</option></select></label></div>
  <label>Website<input class="field" id="a-site" placeholder="company.fi"></label>
  <label>Contact<input class="field" id="a-contact" placeholder="Email or person"></label>
  <label>Why it fits<input class="field" id="a-why"></label>
  <div class="foot"><button class="btn2" type="button" data-close>Cancel</button><button class="btn" type="submit">Add</button></div>
</form></dialog>

<dialog id="setDlg"><form id="setForm">
  <h3>Profile and templates</h3>
  <div class="two"><label>Name<input class="field" id="p-name"></label><label>Email<input class="field" id="p-email" type="email"></label></div>
  <div class="two"><label>Phone<input class="field" id="p-phone"></label><label>Portfolio / GitHub<input class="field" id="p-link"></label></div>
  <label>English template<textarea id="p-en"></textarea></label>
  <label>Finnish template<textarea id="p-fi"></textarea></label>
  <p class="muted">Variables: {company} {name} {email} {phone} {link}. First line starting with “Subject:” becomes the subject.</p>
  <div class="sec"><span class="lbl">Data is stored in this browser</span>
    <div class="links"><button class="btn2" type="button" id="bkExport">Download backup</button><label class="btn2" for="bkFile" style="cursor:pointer">Restore backup</label><input type="file" id="bkFile" accept="application/json" hidden><button class="btn2 danger" type="button" id="bkReset">Reset</button></div></div>
  <div class="foot"><button class="btn2" type="button" data-close>Cancel</button><button class="btn" type="submit">Save</button></div>
</form></dialog>

<div class="toast" id="toast" hidden></div>

const chains={};
function save(id,patch,{redrawDrawer=true}={}){
  const prev=P(id);const next={...prev,stage:prev.stage||"new",...patch,updatedAt:new Date().toISOString()};
  if(patch.stage&&patch.stage!==prev.stage){
    next.log=[...(prev.log||[]),{s:patch.stage,at:new Date().toISOString()}];
    if(patch.stage!=="new"&&!next.date)next.date=todayISO();
    if(patch.stage==="sent"&&!next.followUp)next.followUp=addDays(next.date||todayISO(),7);
  }
  progress[id]=next;redrawDrawer?render():renderKeepDrawer();
  if(!db||!canWrite)return;
  chains[id]=(chains[id]||Promise.resolve()).then(()=>db.collection("progress").doc(id).set(next)).catch(()=>{canWrite=false;$("sync").textContent="Read-only";render()});
}

  if(t.closest("[data-close]")){t.closest("dialog").close();return}

  if(x=t.closest(".row")){open(x.dataset.id)}

$("q").addEventListener("input",()=>{sel=-1;list()});
addEventListener("resize",()=>closeMenu());document.addEventListener("scroll",()=>closeMenu(),true);
$("hiring").onclick=()=>{const b=$("hiring");b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!=="true");list()};
$("modeBtn").onclick=()=>setMode(document.documentElement.dataset.mode==="dark"?"light":"dark");
$("addBtn").onclick=()=>{if(!canWrite){toast("Sign in to add companies");return}$("addDlg").showModal()};
$("addForm").addEventListener("submit",async e=>{
  e.preventDefault();const name=$("a-name").value.trim();if(!name)return;const pr=$("a-prio").value;
  const doc={name,city:$("a-city").value.trim(),site:$("a-site").value.trim().replace(/^https?:\/\//,""),contact:$("a-contact").value.trim(),why:$("a-why").value.trim(),prio:pr,type:"",score:{A:70,B:50,C:30}[pr],source:"Added manually",createdAt:new Date().toISOString()};
  $("addDlg").close();$("addForm").reset();
  try{const ref=await db.collection("custom").add(doc);toast("Added");open("c-"+ref.id)}catch(_){toast("Couldn't add")}
});
function openSettings(){
  $("p-name").value=profile.name||"";$("p-email").value=profile.email||"";$("p-phone").value=profile.phone||"";$("p-link").value=profile.link||"";
  $("p-en").value=profile.en||DEF_EN;$("p-fi").value=profile.fi||DEF_FI;$("setDlg").showModal();
}
$("settingsBtn").onclick=openSettings;
$("bkExport").onclick=()=>backup.export();
$("bkFile").onchange=e=>{const f=e.target.files[0];if(f){backup.import(f);$("setDlg").close()}e.target.value=""};
$("bkReset").onclick=e=>{const b=e.currentTarget;if(b.dataset.sure){backup.reset();$("setDlg").close();delete b.dataset.sure;b.textContent="Reset"}else{b.dataset.sure="1";b.textContent="Click again to erase all data"}};
$("setForm").addEventListener("submit",async e=>{
  e.preventDefault();
  profile={name:$("p-name").value.trim(),email:$("p-email").value.trim(),phone:$("p-phone").value.trim(),link:$("p-link").value.trim(),en:$("p-en").value,fi:$("p-fi").value};
  $("setDlg").close();drawer();
  if(db&&canWrite){try{await db.collection("settings").doc("profile").set(profile);toast("Saved")}catch(_){toast("Couldn't save")}}
});
$("exportBtn").onclick=async()=>{
  const cols=["Rank","Company","City","Fit","Priority","Stage","Contacted","Follow-up","Contact","Website","Notes"];
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const rows=all().slice().sort((a,b)=>(b.score??0)-(a.score??0)).map((c,i)=>{const p=P(c.id);return [i+1,c.name,c.city,c.score,c.prio,LABEL[st(c.id)],p.date,p.followUp,c.contact,c.site,p.notes].map(q).join(",")});
  const csv="﻿"+[cols.map(q).join(","),...rows].join("\n");
  if(!dl){toast("Export isn't available in this view");return}
  try{await dl.save({filename:`pipeline-${todayISO()}.csv`,data:csv})}catch(err){if(err?.code!=="declined")toast("Export failed")}
};
document.addEventListener("keydown",e=>{
  if(!$("menu").hidden){
    const items=[...$("menu").children],i=items.indexOf(document.activeElement);
    if(e.key==="Escape"){e.preventDefault();closeMenu(true)}
    else if(e.key==="ArrowDown"){e.preventDefault();items[(i+1)%items.length].focus()}
    else if(e.key==="ArrowUp"){e.preventDefault();items[(i-1+items.length)%items.length].focus()}
    else if(e.key==="Tab")closeMenu();
    return;
  }
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||"")||document.querySelector("dialog[open]");
  if(e.key==="Escape"&&openId&&!document.querySelector("dialog[open]")){close();return}
  if(typing)return;
  if(e.key==="/"){e.preventDefault();$("q").focus();return}
  if(openId&&/^[1-6]$/.test(e.key)&&canWrite){save(openId,{stage:STAGES[+e.key-1][0]});return}
  if(e.key==="j"||e.key==="ArrowDown"||e.key==="k"||e.key==="ArrowUp"){
    if(!visible.length)return;e.preventDefault();
    const cur=openId?visible.findIndex(c=>c.id===openId):sel;
    sel=Math.max(0,Math.min(visible.length-1,cur+(/j|ArrowDown/.test(e.key)?1:-1)));
    if(openId){openId=visible[sel].id;render()}else{list()}
    document.querySelector(`.row[data-i="${sel}"]`)?.scrollIntoView({block:"nearest"});return}
  if(e.key==="Enter"&&sel>=0&&!openId){open(visible[sel].id)}
});

render();
(()=>{
  const K="harjoittelu-pipeline:";
  const read=(k,d)=>{try{const v=localStorage.getItem(K+k);return v?JSON.parse(v):d}catch(_){return d}};
  const write=(k,v)=>{try{localStorage.setItem(K+k,JSON.stringify(v))}catch(_){toast("Browser storage is unavailable")}};
  let customMap=read("custom",{});
  progress=read("progress",{});profile=read("profile",{});
  const syncCustom=()=>{custom=Object.entries(customMap).map(([cid,d])=>({...d,cid,id:"c-"+cid,custom:true}))};
  syncCustom();
  db={collection(name){return{
    doc(id){return{
      set:async d=>{if(name==="progress"){write("progress",progress)}else if(name==="settings"){write("profile",d)}else{customMap[id]=d;write("custom",customMap);syncCustom();render()}},
      delete:async()=>{if(name==="custom"){delete customMap[id];write("custom",customMap);syncCustom();render()}}}},
    add:async d=>{const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);customMap[id]=d;write("custom",customMap);syncCustom();render();return{id}}
  }}};
  dl={save:async({filename,data})=>{const u=URL.createObjectURL(new Blob([data],{type:filename.endsWith(".json")?"application/json":"text/csv"}));const a=document.createElement("a");a.href=u;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}};
  canWrite=true;$("sync").textContent="";
  window.backup={
    export(){dl.save({filename:`pipeline-backup-${todayISO()}.json`,data:JSON.stringify({version:1,progress,custom:customMap,profile},null,2)})},
    async import(file){try{const j=JSON.parse(await file.text());progress=j.progress||{};customMap=j.custom||{};profile=j.profile||{};write("progress",progress);write("custom",customMap);write("profile",profile);syncCustom();render();toast("Restored")}catch(_){toast("Not a valid backup file")}},
    reset(){progress={};customMap={};profile={};["progress","custom","profile"].forEach(k=>{try{localStorage.removeItem(K+k)}catch(_){}});syncCustom();render();toast("Reset")}
  };
  render();
})();
</script>
